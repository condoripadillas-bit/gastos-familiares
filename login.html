<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Iniciar sesión — Gastos Familiares</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =====================================================
       BOTÓN MODO CLARO / OSCURO
       ===================================================== -->

  <button
    class="theme-button login-theme-button"
    id="themeButton"
    type="button"
    aria-label="Cambiar a modo oscuro"
  >
    🌙
  </button>


  <!-- =====================================================
       DECORACIÓN DEL FONDO
       ===================================================== -->

  <div class="login-decoration login-decoration--one">
    ✦
  </div>

  <div class="login-decoration login-decoration--two">
    ✧
  </div>

  <div class="login-decoration login-decoration--three">
    ✦
  </div>


  <!-- =====================================================
       MARIPOSAS
       ===================================================== -->

  <div class="login-butterfly butterfly--one">
    🦋
  </div>

  <div class="login-butterfly butterfly--two">
    🦋
  </div>

  <div class="login-butterfly butterfly--three">
    🦋
  </div>

  <div class="login-butterfly butterfly--four">
    🦋
  </div>


  <!-- =====================================================
       LOGIN
       ===================================================== -->

  <main class="login-wrapper">

    <section class="login-card">

      <!-- ICONO -->
      <div class="login-icon">
        💰
      </div>


      <!-- TÍTULO -->
      <h1 class="login-card__title">
        Gastos Familiares
      </h1>


      <!-- SUBTÍTULO -->
      <p
        class="login-card__subtitle"
        id="loginSubtitle"
      >
        Inicia sesión para continuar
      </p>


      <!-- =================================================
           FORMULARIO
           ================================================= -->

      <form
        id="formLogin"
        class="form-login"
      >

        <!-- CORREO -->
        <div class="form-group">

          <label for="email">
            Correo electrónico
          </label>

          <input
            type="email"
            id="email"
            required
            autocomplete="email"
            placeholder="estudiante@colegio.edu"
          >

        </div>


        <!-- CONTRASEÑA -->
        <div class="form-group">

          <label for="password">
            Contraseña
          </label>

          <input
            type="password"
            id="password"
            required
            minlength="6"
            autocomplete="current-password"
            placeholder="Mínimo 6 caracteres"
          >

        </div>


        <!-- BOTONES -->
        <div class="form-actions login-actions">

          <button
            type="submit"
            class="btn btn--primary"
            id="btnAcceder"
          >
            Iniciar sesión
          </button>


          <button
            type="button"
            class="btn btn--ghost"
            id="btnCambiarModo"
          >
            Crear una cuenta nueva
          </button>

        </div>

      </form>

    </section>

  </main>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabaseClient.js"></script>

  <script src="toast.js"></script>

  <script src="auth.js"></script>

  <script src="login.js"></script>


  <!-- =====================================================
       MODO CLARO / OSCURO
       ===================================================== -->

  <script>

    const themeButton =
      document.getElementById("themeButton");


    /*
     * Aplicar el tema guardado.
     *
     * Si el usuario eligió oscuro en index.html,
     * el login también aparecerá oscuro.
     *
     * Si eligió claro, el login aparecerá claro.
     */

    function aplicarTemaLogin() {

      const temaGuardado =
        localStorage.getItem("tema") || "claro";


      if (temaGuardado === "oscuro") {

        document.body.classList.add("dark-mode");


        if (themeButton) {

          themeButton.textContent = "☀️";

          themeButton.setAttribute(
            "aria-label",
            "Cambiar a modo claro"
          );

        }

      } else {

        document.body.classList.remove("dark-mode");


        if (themeButton) {

          themeButton.textContent = "🌙";

          themeButton.setAttribute(
            "aria-label",
            "Cambiar a modo oscuro"
          );

        }

      }

    }


    /*
     * Aplicar inmediatamente el tema guardado
     */

    aplicarTemaLogin();


    /*
     * Botón para cambiar el tema
     */

    if (themeButton) {

      themeButton.addEventListener(
        "click",
        function () {

          const estaOscuro =
            document.body.classList.contains(
              "dark-mode"
            );


          if (estaOscuro) {

            localStorage.setItem(
              "tema",
              "claro"
            );

          } else {

            localStorage.setItem(
              "tema",
              "oscuro"
            );

          }


          aplicarTemaLogin();

        }
      );

    }

  </script>

</body>

</html>
